services:
  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: ../../.env.docker
        required: false
    environment:
      - NODE_ENV=development
      - HUSKY=0
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
