services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    image: shipsaas:local
    ports:
      - "3000:3000"
    env_file:
      - path: ../../.env.production
        required: false
    environment:
      - NODE_ENV=production
      - HUSKY=0
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
