services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    image: shipsaas:local
    ports:
      - "3000:3000"
    env_file:
      - path: ../../.env.production
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://produser:prodpass@postgres:5432/shipsaasprod
      - HUSKY=0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=produser
      - POSTGRES_PASSWORD=prodpass
      - POSTGRES_DB=shipsaasprod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produser -d shipsaasprod"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
